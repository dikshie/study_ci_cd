name: "03 - Security & Vulnerability Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  security-audit:
    name: Security & SAST Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Audit Tools
        run: |
          uv sync --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run Bandit (SAST Code Vulnerability Scan)
        run: |
          uv run bandit -r src/ -f json -o bandit-results.json || true
          uv run bandit -r src/ -ll

      - name: Run Pip-Audit (Dependency Vulnerability Scan)
        run: |
          uv run pip-audit -r requirements.txt || true

      - name: Upload Security Scan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-results.json
          retention-days: 14
